# Copy to ~/.cloudflared/config.yml (or pass --config to `cloudflared tunnel run`).
# credentials-file must point at the JSON created by `cloudflared tunnel create`.
tunnel: nano-agents
credentials-file: /path/to/.cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: api.example.com
    service: http://127.0.0.1:3000
  - service: http_status:404
